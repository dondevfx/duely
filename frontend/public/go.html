<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Duely</title>
<!--
  The link that goes in the Instagram bio.

  Instagram opens links in its own embedded webview, not Safari or Chrome. That
  webview has its own cookie and storage jar, which is why signing in there
  "works" and then the session is gone the moment anyone opens the real site —
  and why a player tapping through from the bio lands logged out.

  So this page tries to hand the visitor to their real browser, and if it cannot,
  gets out of the way and loads the site regardless. It is never a destination:

    1. Android — the intent:// scheme. Documented, and it works.
    2. iOS — instagram://extbrowser, which asks Instagram to open the link in the
       default browser. UNDOCUMENTED: it works today and Meta can remove it in
       any release without telling anyone.
    3. Whatever happened, the site loads a moment later.

  Layer 3 is what makes layers 1 and 2 safe to rely on. Neither reports back —
  an unsupported scheme in a webview simply does nothing — so the only way to
  know they failed is that we are still here, and being still here has to end
  with the visitor on the home page rather than on this one.

  Anyone NOT in an in-app browser is sent straight through and sees none of it.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0D0D0D; }
  body {
    display: flex; align-items: center; justify-content: center;
    color: #1250B4;
    font: 900 40px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }
  .mark { display: inline-flex; align-items: center; gap: 8px;
          text-shadow: 0 0 22px rgba(18, 80, 180, 0.55); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #1250B4;
         animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <!-- The wordmark only. There is nothing here to read and nothing to decide:
       within about a second this page is replaced either by the real browser or
       by the site itself. -->
  <div class="mark">Duely<span class="dot"></span></div>

<script>
(function () {
  'use strict';

  var SITE = 'https://www.duely.us';

  // Carry the query string and hash through, so a referral or invite link still
  // works after the hop. The PATH is not carried: this page is only ever the
  // bio link, and taking a destination out of the URL is how a bio link becomes
  // an open redirect pointed at someone else's page.
  var target = SITE + window.location.search + window.location.hash;
  var bare   = target.replace(/^https?:\/\//, '');

  var ua = navigator.userAgent || '';
  // Instagram and the Facebook family share a webview. Messenger, Threads,
  // TikTok, Snapchat, Twitter and LinkedIn have the same problem and the same
  // escape, so they are all treated as "stuck".
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Threads|Line\/|MicroMessenger|TikTok|Snapchat|Twitter|LinkedInApp/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
              // iPadOS reports itself as a Mac; the touch points give it away.
              (/Macintosh/.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);

  // A normal browser has no problem to solve. `replace` rather than `assign` so
  // this page never sits in history between the visitor and the app — otherwise
  // Back from the home page bounces them through the redirect again.
  if (!inApp) { window.location.replace(target); return; }

  function attempt() {
    if (isAndroid) {
      // Documented and reliable. `S.browser_fallback_url` is what Android loads
      // when Chrome is not installed, so that device lands on the site rather
      // than on an error page — and never reaches the timer below at all.
      window.location.href =
        'intent://' + bare +
        '#Intent;scheme=https;package=com.android.chrome;' +
        'S.browser_fallback_url=' + encodeURIComponent(target) + ';end';
      return;
    }
    if (isIOS) {
      window.location.href = 'instagram://extbrowser/?url=' + encodeURIComponent(target);
      return;
    }
    // An in-app browser we recognised but cannot escape from. Nothing to try.
    window.location.replace(target);
  }

  // Did the hand-off work?
  //
  // Neither scheme reports success, so the signal is indirect: if the real
  // browser opened, this webview went to the background, and the page is hidden
  // or has lost focus. Without this check the fallback fires anyway and drags
  // the abandoned webview to the home page behind the browser that just opened
  // — harmless, but it leaves a stale logged-out Duely sitting in Instagram for
  // the visitor to find later and be confused by.
  var left = false;
  var mark = function () { left = true; };
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) mark();
  });
  window.addEventListener('pagehide', mark);
  window.addEventListener('blur', mark);

  attempt();

  // Still here means it did not work. Load the site in the webview: a signed-out
  // home page they can browse is worse than Safari and far better than a dead
  // end, and it is what someone who taps a link expects to happen.
  //
  // 1200ms is chosen against the failure it is covering. Shorter and it can cut
  // off a scheme the OS is still handing over, sending the visitor to the
  // webview a moment before their browser opens; much longer and a visitor whose
  // escape silently failed is staring at a wordmark wondering if it is broken.
  setTimeout(function () {
    if (left || document.hidden) return;
    window.location.replace(target);
  }, 1200);
}());
</script>
</body>
</html>
