<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duely — 1v1 Gaming Platform</title>
    <meta name="description" content="Compete 1v1 in real-time games. Wager C Coins and climb the leaderboard." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1355C0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Duely" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* Hide Google Translate toolbar */
      .goog-te-banner-frame, .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0 !important; }
      #goog-gt-tt, .goog-te-balloon-frame, .goog-tooltip, .goog-tooltip-content { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
    </style>
    <script>
      // Auto-detect language from browser on first visit, then set googtrans cookie
      (function() {
        var GOOGLE = { de:'de', zh:'zh-CN', ru:'ru', es:'es', it:'it', ja:'ja', fi:'fi' };
        var saved = localStorage.getItem('language');
        if (!saved) {
          var browser = (navigator.language || navigator.userLanguage || 'en').toLowerCase().split('-')[0];
          saved = GOOGLE[browser] ? browser : 'en';
          localStorage.setItem('language', saved);
        }
        var google = GOOGLE[saved];
        var expire = 'expires=Thu, 01 Jan 1970 00:00:00 GMT';
        if (google) {
          document.cookie = 'googtrans=/en/' + google + '; path=/';
          document.cookie = 'googtrans=/en/' + google + '; path=/; domain=' + window.location.hostname;
        } else {
          document.cookie = 'googtrans=; path=/; ' + expire;
          document.cookie = 'googtrans=; path=/; domain=' + window.location.hostname + '; ' + expire;
        }
      })();
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display:none;visibility:hidden;position:absolute;width:0;height:0;overflow:hidden"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
