    <script>
      // Get the game-card posters moving before the app bundle does.
      //
      // The cards are React, so nothing on them is discoverable until a 1.2MB
      // module bundle has been fetched, parsed and run. Only then does the
      // browser learn a poster exists and go ask for it — which is the second
      // of icon-only cards you see on a cold load. The clips themselves are
      // fine: they are all faststart, so the first frame plays without the
      // whole file, and each card already holds its poster up until its clip
      // can play without stalling. The gap was never the video, it was that
      // the still had not arrived either.
      //
      // Every poster together is about a tenth of the bundle, and these go out
      // in parallel with it rather than after it, so the cards paint at first
      // render instead of a beat later.
      //
      // Only on the two pages that have cards. A cold load straight to the
      // wallet or a game should not spend a phone's bandwidth on posters it
      // will not show — and this being an inline script rather than static
      // <link> tags is what buys that choice. It still runs long before the
      // module bundle, which is deferred by definition.
      (function () {
        var p = location.pathname.replace(/\/+$/, '');
        if (p !== '' && p !== '/games') return;
        // Card order on Home, so the ones above the fold are requested first.
        // Card order on Home. Tournaments leads the grid but has no clip —
        // it is not one game — so there is no poster of it to preload.
        var slugs = ['block-blast', 'car-dash', 'coin-flip',
                     'color-rush', 'tower', 'scrabble', 'blackjack'];
        for (var i = 0; i < slugs.length; i++) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = '/game-clips/' + slugs[i] + '.jpg';
          if (i < 4) l.fetchPriority = 'high';
          document.head.appendChild(l);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* Hide Google Translate toolbar */
      .goog-te-banner-frame, .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0 !important; }
      #goog-gt-tt, .goog-te-balloon-frame, .goog-tooltip, .goog-tooltip-content { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }

      /* ── The boot splash ────────────────────────────────────────────────
         The markup inside #root, which React replaces on mount. In the head
         rather than the app's stylesheet because the point is to render
         correctly BEFORE any of the app's CSS has been fetched.

         The app's stylesheet has not loaded yet, so no reset is in force and
         the browser's default 8px body margin still applies — with it, the
         splash measured 876px against an 812px viewport and scrolled. */
      html, body { margin: 0; background: #000; }
      .boot {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .375rem;
        background: #000;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      /* The navbar wordmark, matched exactly — same weight, colour and glow,
         and the same pulsing dot — so the splash reads as the app starting
         rather than as a different page that then changes. */
      .boot-mark {
        font-size: 2.75rem; font-weight: 900; letter-spacing: -.025em;
        color: #1250B4; text-shadow: 0 0 22px rgba(18, 80, 180, .6);
      }
      .boot-dot {
        width: .5rem; height: .5rem; border-radius: 9999px; background: #1250B4;
        animation: boot-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
      }
      @keyframes boot-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }
      @media (prefers-reduced-motion: reduce) { .boot-dot { animation: none } }
      /* Only ever seen by a reader with no JavaScript. */
      .boot-note {
        max-width: 34rem; margin: 0 auto; padding: 4rem 1.5rem; color: #fff;
        line-height: 1.6; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .boot-note a { color: #3B82F6; }
    </style>
    <script>
      // Auto-detect language from browser on first visit, then set googtrans cookie
      (function() {
        var GOOGLE = { de:'de', zh:'zh-CN', ru:'ru', es:'es', it:'it', ja:'ja', fi:'fi' };
        var saved = localStorage.getItem('language');
        if (!saved) {
          var browser = (navigator.language || navigator.userLanguage || 'en').toLowerCase().split('-')[0];
          saved = GOOGLE[browser] ? browser : 'en';
          localStorage.setItem('language', saved);
        }
        var google = GOOGLE[saved];
        var expire = 'expires=Thu, 01 Jan 1970 00:00:00 GMT';
        if (google) {
          document.cookie = 'googtrans=/en/' + google + '; path=/';
          document.cookie = 'googtrans=/en/' + google + '; path=/; domain=' + window.location.hostname;
        } else {
          document.cookie = 'googtrans=; path=/; ' + expire;
          document.cookie = 'googtrans=; path=/; domain=' + window.location.hostname + '; ' + expire;
        }
      })();
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display:none;visibility:hidden;position:absolute;width:0;height:0;overflow:hidden"></div>
    <!--
      The splash the app renders over.

      React replaces all of this on mount (createRoot().render swaps the
      children out), so it is on screen only until the bundle arrives — but on
      a phone on mobile data that is a second or two, and it IS seen.

      Just the wordmark, centred. It matches the one in the navbar exactly
      (same weight, colour and glow, same pulsing dot), so the splash reads as
      the app starting rather than as a different page that then changes.

      The description lives in <noscript> now rather than in the markup.
      Something has to be here for a reader that does not run JavaScript —
      Google's OAuth branding check fetches this page with no JS and rejected
      an empty <div id="root"></div> as "unresponsive", and search engines and
      link previews read it the same way. noscript is the honest way to do
      that: it is served to everyone, and shown only to a reader with no
      JavaScript, who is exactly the audience it is written for. Nobody with a
      working browser sees it, and nothing is hidden from anyone.

      The game list is in src/data/games.js. If it changes, change it here.
    -->
    <div id="root">
      <div class="boot">
        <span class="boot-mark">Duely</span>
        <span class="boot-dot"></span>
      </div>
      <noscript>
        <div class="boot-note">
          <h1>Duely</h1>
          <p>Duely is a head-to-head gaming platform. Pick a game, set a stake, and play
             a live 1v1 match against another player or against a bot. Most of the games
             are pure skill — reaction, accuracy and speed decide them.</p>
          <p>Seven games: Block Burst, Rush Hour, Color Rush, Tower, Word VS, Coin Flip
             and Blackjack. Each can be played solo, against a bot, or ranked against
             another player.</p>
          <p>Tournaments run three times an hour: sixteen players, four rounds, a
             different game each round, and prizes for the top three.</p>
          <p>Duely needs JavaScript to run. Please enable it, or open
             <a href="https://www.duely.us">www.duely.us</a> in a current browser.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
