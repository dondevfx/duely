// =========================================================
// CS:GO Offline Mod Menu (Bot Match / sv_cheats only)
// =========================================================
// HOW TO INSTALL:
// 1. Copy this whole "csgo-mod-menu" folder's .cfg files into:
//    <Steam>/steamapps/common/Counter-Strike Global Offensive/csgo/cfg/
// 2. Start an OFFLINE match with bots (Play > vs Bots / Offline with Bots).
// 3. Open the console (~) and type:  exec modmenu
// 4. Use the keybinds below (F1-F12) to toggle stuff.
// NOTE: sv_cheats only works on a server you control (offline/bot/LAN
// listen server). It will NOT work on Valve/community matchmaking servers,
// and most of these commands are blocked there anyway.
// =========================================================

sv_cheats 1

// -------------------- STATE TOGGLES --------------------
// Each "toggle" below flips a cvar on/off when you press the bound key.

// F1 - Infinite ammo (no reload needed, clip refills)
bind "F1" "toggle sv_infinite_ammo 0 1"

// F2 - No-clip (fly through walls)
bind "F2" "noclip"

// F3 - God mode (invincible)
bind "F3" "toggle god 0 1"

// F4 - Low gravity
bind "F4" "mm_gravity_toggle"
alias "mm_gravity_low" "sv_gravity 200; alias mm_gravity_toggle mm_gravity_normal"
alias "mm_gravity_normal" "sv_gravity 800; alias mm_gravity_toggle mm_gravity_low"
alias "mm_gravity_toggle" "mm_gravity_low"

// F5 - Speed boost toggle
bind "F5" "mm_speed_toggle"
alias "mm_speed_fast" "host_timescale 1.5; alias mm_speed_toggle mm_speed_normal"
alias "mm_speed_normal" "host_timescale 1.0; alias mm_speed_toggle mm_speed_fast"
alias "mm_speed_toggle" "mm_speed_fast"

// F6 - Give yourself full equipment (bomb, defuse kit, all grenades)
bind "F6" "mm_give_loadout"
alias "mm_give_loadout" "give weapon_hegrenade; give weapon_flashbang; give weapon_smokegrenade; give weapon_molotov; give item_defuser; give item_assaultsuit"

// F7 - Give AK-47 / M4 + AWP (drops automatically replace held weapon)
bind "F7" "mm_give_guns"
alias "mm_give_guns" "give weapon_ak47; give weapon_awp; give weapon_deagle"

// F8 - Max money ($16000)
bind "F8" "mp_maxmoney 60000; mp_startmoney 16000; give item_kevlar"

// F9 - Slow-motion bullet time (great for trick shots / practice)
bind "F9" "mm_slowmo_toggle"
alias "mm_slowmo_on" "host_timescale 0.3; alias mm_slowmo_toggle mm_slowmo_off"
alias "mm_slowmo_off" "host_timescale 1.0; alias mm_slowmo_toggle mm_slowmo_on"
alias "mm_slowmo_toggle" "mm_slowmo_on"

// F10 - Respawn instantly as either team (bot match only)
bind "F10" "mp_respawn_on_death_ct 1; mp_respawn_on_death_t 1; mp_buy_anywhere 1"

// F11 - Unlimited round time / freeze time off (more time to mess around)
bind "F11" "mp_roundtime 60; mp_freezetime 0; mp_round_restart_delay 0"

// F12 - Reset everything to defaults / turn off cheats
bind "F12" "mm_reset"
alias "mm_reset" "sv_gravity 800; host_timescale 1; god 0; noclip; sv_infinite_ammo 0; echo MOD MENU RESET"

// -------------------- INFO --------------------
echo "================================================"
echo " CS:GO Offline Mod Menu loaded."
echo " F1 Infinite Ammo | F2 Noclip | F3 God Mode"
echo " F4 Low Gravity   | F5 Speed Boost | F6 Full Kit"
echo " F7 AK/AWP/Deagle | F8 Max Money  | F9 Slow-Mo"
echo " F10 Instant Respawn | F11 Long Rounds | F12 Reset"
echo "================================================"
